[package]
name = "NexusIntelliCore"
version = "0.7.0"
edition = "2021"

[[bin]]
name = "nexusintellicore"
path = "src/main.rs"

[dependencies]
# MCP Server and communication
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1"

# Static Analysis Core — use one tree-sitter ABI shared by all grammar crates
tree-sitter = "0.22"
tree-sitter-rust = "0.21.2"
tree-sitter-java = "0.21.0"
tree-sitter-javascript = "0.21.4"
tree-sitter-typescript = "0.21.2"
tree-sitter-python = "0.21.0"
tree-sitter-c = "0.21.4"
tree-sitter-c-sharp = "0.21.3"
tree-sitter-go = "0.21.2"
tree-sitter-kotlin = "0.3.8"

# File System and Graph Utilities
ignore = "0.4"
petgraph = "0.6"
globset = "0.4"


# Sanitization and Privacy
regex = "1.10"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter-css = "0.21.1"
tree-sitter-html = "0.20.4"

# File watcher for cache invalidation
notify = "6"
moka = { version = "0.12", features = ["future"] }

# Security lints — enforced at package level
[lints.clippy]
undocumented_unsafe_blocks = "warn"
panic = "warn"

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
tempfile = "3"
